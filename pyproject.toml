[project]
name = "till"
version = "0.1.0"
description = "Implementación de referencia abierta de una red de cajeros de sucursal automatizados (Etapa 1: automatización determinista)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Christian Hernández Escamilla" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyiso8583>=4.0",
]

[project.optional-dependencies]
pruebas = ["pytest>=8", "hypothesis>=6", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
# Aviso de Starlette sobre su cliente de pruebas basado en httpx (ajeno a Till).
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
